<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Username qidiruvi</title>
<style>
:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#14213d; --muted:#5d6b85; --line:#d3dae6;
  --found:#0f766e; --found-bg:#d9f2ee; --err:#9a5b00;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1626; --surface:#18223a; --ink:#e8edf7; --muted:#92a0bb; --line:#2a3858;
    --found:#4fd1c0; --found-bg:#12383a; --err:#e0a458; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:max(24px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom))}
main{max-width:760px;margin:0 auto}
h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;letter-spacing:-.03em;margin:8vh 0 12px;font-weight:800}
.lead{color:var(--muted);margin:0 0 28px;max-width:52ch}
form{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:14px 16px;border:2px solid var(--line);
  border-radius:10px;background:var(--surface);color:var(--ink)}
input[type=text]:focus-visible,button:focus-visible{outline:3px solid var(--found);outline-offset:2px}
button{font:inherit;font-weight:700;padding:0 24px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 12px;color:var(--muted);font-size:.95rem;flex-wrap:wrap}
.bar strong{color:var(--ink)}
label{display:flex;align-items:center;gap:8px;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
li{padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:flex;
  justify-content:space-between;align-items:center;gap:8px;min-height:50px}
li .name{font-weight:600}
li .st{font-size:.85rem;color:var(--muted)}
li.found{border-color:var(--found);background:var(--found-bg)}
li.found .st{color:var(--found);font-weight:700}
li.notfound{opacity:.55}
li.error .st{color:var(--err)}
li a{color:inherit;text-decoration:none;display:contents}
li a:hover .name{text-decoration:underline}
.hide-miss li.notfound,.hide-miss li.error{display:none}
.note{margin-top:28px;color:var(--muted);font-size:.9rem;max-width:62ch}
.auth{display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:44px;font-size:.95rem;color:var(--muted)}
.auth a{color:var(--ink)}
.msg{color:var(--err);margin:12px 0 0;min-height:1.5em}
@media (prefers-reduced-motion:no-preference){ li.pending .st{animation:p 1s ease-in-out infinite} @keyframes p{50%{opacity:.35}} }
</style>
</head>
<body>
<main>
  <div class="auth" id="auth"></div>
  <h1>Username qayerda ro'yxatdan o'tgan?</h1>
  <p class="lead">Username kiriting. Biz uni ochiq profillar bor mashhur platformalarda tekshirib beramiz.</p>

  <form id="f">
    <input id="u" type="text" placeholder="masalan: sunnatillofficial" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Username" autofocus>
    <button id="go" type="submit">Qidirish</button>
  </form>
  <p class="msg" id="msg" role="alert"></p>

  <div id="out" hidden>
    <div class="bar">
      <span id="count"></span>
      <label><input type="checkbox" id="only"> Faqat topilganlar</label>
    </div>
    <ul id="list"></ul>
    <p class="note">Natijalar taxminiy: ba'zi saytlar so'rovlarni cheklaydi yoki boshqa sahifaga yo'naltiradi. "Tekshirib bo'lmadi" belgisi bo'lsa, havolani qo'lda oching.</p>
  </div>
</main>

<script>
const API = "/.netlify/functions/check";
const $ = (id) => document.getElementById(id);
const LABEL = { found: "Topildi", notfound: "Topilmadi", error: "Tekshirib bo'lmadi", pending: "Tekshirilmoqda…" };
let run = 0, me = { user: null, bot: null, required: false };

async function initAuth() {
  try { me = await (await fetch("/.netlify/functions/auth?me=1")).json(); } catch (e) { return; }
  const box = $("auth");
  if (me.user) {
    box.append(document.createTextNode(me.user.username ? "@" + me.user.username : me.user.name), " · ");
    const out = document.createElement("a");
    out.href = "/.netlify/functions/auth?logout=1"; out.textContent = "Chiqish";
    box.append(out);
  } else if (me.bot) {
    const s = document.createElement("script");
    s.async = true; s.src = "https://telegram.org/js/telegram-widget.js?22";
    s.setAttribute("data-telegram-login", me.bot);
    s.setAttribute("data-size", "medium");
    s.setAttribute("data-auth-url", "/.netlify/functions/auth");
    s.setAttribute("data-request-access", "write");
    box.append(s);
  }
  if (me.required && !me.user) $("msg").textContent = "Qidirish uchun Telegram orqali kiring.";
}
initAuth();

$("only").addEventListener("change", (e) => $("out").classList.toggle("hide-miss", e.target.checked));

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const user = $("u").value.trim().replace(/^@/, "");
  $("msg").textContent = "";
  if (me.required && !me.user) { $("msg").textContent = "Qidirish uchun avval Telegram orqali kiring."; return; }
  if (!/^[A-Za-z0-9._-]{1,40}$/.test(user)) {
    $("msg").textContent = "Username faqat lotin harflari, raqamlar, nuqta, tire va pastki chiziqdan iborat bo'lishi kerak (40 belgigacha).";
    return;
  }
  const id = ++run;
  $("go").disabled = true;
  $("out").hidden = false;
  $("list").replaceChildren();

  let names;
  try {
    names = await (await fetch(API)).json();
  } catch (err) {
    $("msg").textContent = "Serverga ulanib bo'lmadi. Sahifani yangilab, qayta urinib ko'ring.";
    $("go").disabled = false;
    return;
  }

  const items = names.map((n) => {
    const li = document.createElement("li");
    li.className = "pending";
    li.innerHTML = '<span class="name"></span><span class="st"></span>';
    li.querySelector(".name").textContent = n;
    li.querySelector(".st").textContent = LABEL.pending;
    $("list").appendChild(li);
    return li;
  });

  let done = 0, found = 0;
  const tally = () => ($("count").innerHTML = `<strong>${found}</strong> ta topildi, ${done} / ${items.length} tekshirildi`);
  tally();

  await Promise.all(items.map(async (li, i) => {
    let r = { state: "error" };
    try {
      r = await (await fetch(`${API}?u=${encodeURIComponent(user)}&s=${i}`)).json();
    } catch (err) {}
    if (id !== run) return;
    li.className = r.state in LABEL ? r.state : "error";
    li.querySelector(".st").textContent = LABEL[li.className];
    if (r.url && r.state !== "notfound") {
      const a = document.createElement("a");
      a.href = r.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      while (li.firstChild) a.appendChild(li.firstChild);
      li.appendChild(a);
    }
    if (r.state === "found") found++;
    done++; tally();
  }));
  if (id === run) $("go").disabled = false;
});
</script>
</body>
</html>
